workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - build
  - package
  - deploy

variables:
  GIT_DEPTH: "20"
  SERVER_RUNNER_TAG: "race-server"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

default:
  interruptible: true

lint:gitlab-ci:
  stage: validate
  tags: ["$SERVER_RUNNER_TAG"]
  script:
    - test -f .gitlab-ci.yml
    - test -f packaging/systemd/openhover-raceserver.service
    - test -x packaging/debian/openhover-deploy

build:raceserver:linux:
  stage: build
  tags: ["$SERVER_RUNNER_TAG"]
  script:
    - export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"; cmake -S . -B build/raceserver -DCMAKE_BUILD_TYPE=Release -DOPENHOVER_PACKAGE_VERSION="${PACKAGE_VERSION:-0.0.0+${CI_COMMIT_SHORT_SHA}}"
    - cmake --build build/raceserver --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
    - ctest --test-dir build/raceserver --output-on-failure
  artifacts:
    expire_in: 7 days
    paths:
      - build/raceserver/

package_race_server:
  stage: package
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: build:raceserver:linux
      artifacts: true
  script:
    - cpack --config build/raceserver/CPackConfig.cmake --generator DEB
    - mkdir -p dist
    - cp build/raceserver/packages/openhover-raceserver_*.deb dist/
  artifacts:
    name: "openhover-raceserver-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/openhover-raceserver_*.deb
    expire_in: 30 days

deploy_race_server:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: package_race_server
      artifacts: true
  resource_group: production-race-server
  environment:
    name: production
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: false
  script:
    - sudo /usr/local/sbin/openhover-deploy dist/openhover-raceserver_*.deb